<div class="page-wrapper">

  <aside class="menu-sidebar d-none d-lg-block" [ngClass]="{ 'open': sidebarOpen, 'close': !sidebarOpen }">
    <div class="logo">
      <a routerLink="/products">
        <img src="assets/images/logo.png" alt="shop" class="img-responsive">
      </a>
    </div>

    <app-product-category-menu></app-product-category-menu>

  </aside>

  <div class="page-container">

    <header class="header-desktop">
      <div class="section-content section-content-p30">
        <div class="container-fluid">
          <ul class="header-wrap">
            <li class="burger" (click)="toggleSidebar()">
              <i [class]="sidebarOpen ? 'fas fa-times' : 'fas fa-bars'"></i>
            </li>
            <li class="menu" [class.is-open]="sidebarOpen">
              <app-search class="menu-item"></app-search>
              <app-login-status class="menu-item"></app-login-status>
            </li>
            <app-cart-status></app-cart-status>
          </ul>
          <div class="account-wrap"></div>
        </div>
      </div>
    </header>
    <div class="content-container">
      <router-outlet></router-outlet>
    </div>
  </div>
  <footer>
    <ul>
      <li><a href="#">About Us</a></li>
      <li><a href="#">Contact Us</a></li>
      <li><a href="#">Help</a></li>
    </ul>
  </footer>
</div>

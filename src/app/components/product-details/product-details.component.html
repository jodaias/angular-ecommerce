<div class="main-content">
    <div class="detail-section">
        <div class="container-fluid">

            <img src="{{ product.imageUrl }}" class="detail-img">

            <h3>{{ product.name }}</h3>
            <div class="price">{{ product.unitPrice | currency:'BRL' }}</div>
            <button (click)="addToCart()" class="btn btn-primary btn-sm">Comprar</button>

            <hr>
            <h4>Description</h4>
            <p>{{ product.description }}</p>

            <a routerLink="/products" class="btn btn-primary mt-5">Voltar</a>
        </div>
    </div>
</div>

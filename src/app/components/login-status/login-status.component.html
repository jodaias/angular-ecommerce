<div class="login-status-header">
    <app-login *ngIf="!this.isAuthenticated" routerLink="/login" class="security-btn">Login</app-login>


    <button *ngIf="this.isAuthenticated" routerLink="/members" class="security-btn ms-1">Member</button>

    <button *ngIf="this.isAuthenticated" routerLink="/order-history" class="security-btn ms-1">Orders</button>
    <div *ngIf="this.isAuthenticated && userFullName" class="login-status-user-info">
        Bem vindo de volta {{ userFullName }}
    </div>
    <button *ngIf="this.isAuthenticated" (click)="logout()" class="security-btn">Logout</button>
</div>
